site_name: EQ-INSAR
site_url: https://kcieslik.github.io/eq-insar/
site_description: "Lightweight, physics-based forward model for generating synthetic InSAR surface deformation data from earthquake sources. Designed for ML training, benchmarking, and sensitivity analysis."
site_author: Konrad Cieslik
repo_url: https://github.com/kcieslik/eq-insar
repo_name: kcieslik/eq-insar

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - API Reference:
      - Generators: api/generators.md
      - Core Physics: api/core.md
      - InSAR Processing: api/insar.md
      - Satellites: api/satellites.md
      - I/O: api/io.md
      - Visualization: api/visualization.md
  - Examples: examples.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            docstring_style: numpy
            docstring_section_style: spacy
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kcieslik/eq-insar
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/eq-insar/
